version: 0.2

phases:
  build:
    commands:
      - |
        set -eu

        REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        IMAGE_TAG="$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-12)"
        if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG="$CODEBUILD_BUILD_NUMBER"; fi
        IMAGE_URI="${REGISTRY}/${IMAGE_REPO_NAME}:${IMAGE_TAG}"

        echo "Logging in to ECR..."
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" |
          docker login --username AWS --password-stdin "$REGISTRY"

        echo "Building ${IMAGE_URI}"
        docker build -t "$IMAGE_URI" .

        echo "Starting container for health test..."
        docker run -d --name myapp-ci-test -p 3001:3001 "$IMAGE_URI"

        HEALTHY=0
        for i in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:3001/health; then
            HEALTHY=1
            echo
            echo "Application health test passed."
            break
          fi
          sleep 2
        done

        if [ "$HEALTHY" -ne 1 ]; then
          docker logs myapp-ci-test || true
          docker rm -f myapp-ci-test || true
          echo "ERROR: Application health test failed."
          exit 1
        fi

        docker rm -f myapp-ci-test

        echo "Pushing image..."
        docker push "$IMAGE_URI"

        printf '{"ImageURI":"%s"}\n' "$IMAGE_URI" > imageDetail.json
        cat imageDetail.json

artifacts:
  files:
    - imageDetail.json
