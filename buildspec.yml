version: 0.2

env:
  variables:
    ECR_REPOSITORY: "myapp-repo"
    CONTAINER_NAME: "myapp-container"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - cd src && npm install && cd ..
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPOSITORY_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}"
      - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG="manual-${CODEBUILD_BUILD_NUMBER}"; fi
  build:
    commands:
      - echo "Running unit tests"
      - cd "$CODEBUILD_SRC_DIR/src" && npm test
      - cd "$CODEBUILD_SRC_DIR"
      - echo "Building Docker image"
      - docker build --pull -t "${REPOSITORY_URI}:${IMAGE_TAG}" .
      - docker tag "${REPOSITORY_URI}:${IMAGE_TAG}" "${REPOSITORY_URI}:latest"
  post_build:
    commands:
      - echo "Pushing image to ECR"
      - docker push "${REPOSITORY_URI}:${IMAGE_TAG}"
      - docker push "${REPOSITORY_URI}:latest"
      - printf '{"ImageURI":"%s"}\n' "${REPOSITORY_URI}:${IMAGE_TAG}" > imageDetail.json
      - echo "Image detail file:"
      - cat imageDetail.json

artifacts:
  files:
    - appspec.yml
    - taskdef.json
    - imageDetail.json
    - pipeline-diagram.png
    - README.md
  discard-paths: yes
